  <style>
    .chatbot-link {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--primary);
      color: white !important;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(12, 112, 242, 0.35);
    }

    .chatbot-link::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      transition: left 0.5s;
    }

    .chatbot-link:hover::before {
      left: 100%;
    }

    .chatbot-link:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(12, 112, 242, 0.5);
    }

    .chatbot-icon {
      font-size: 16px;
      animation: gentlePulse 3s ease-in-out infinite;
    }

    @keyframes gentlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Scroll reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }
  </style>
  
  <title>{% block title %}Muhammad Farhan - Senior Backend Engineer | Python | Odoo | Manchester{% endblock %}</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Base Styles -->
  <style type="text/tailwindcss">
    :root {
        --primary: #0c70f2;
        --primary-dark: #0a5dd1;
        --primary-light: #3b82f6;
        --dark-blue: #0a192f;
        --dark-blue-light: #112240;
        --slate-gray: #64748b;
        --slate-light: #94a3b8;
        --light-gray: #f1f5f9;
        --white: #ffffff;
        --shadow-light: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        --shadow-medium: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        --shadow-large: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        --border-radius-sm: 8px;
        --border-radius-md: 12px;
        --border-radius-lg: 16px;
        --border-radius-xl: 20px;
      }
      
      body {
        font-family: 'DM Sans', sans-serif;
        line-height: 1.6;
        position: relative;
        margin: 0;
        overflow-x: hidden;
      }

      h1, h2, h3, h4, h5, h6, .gradient-text, .section-title {
        font-family: 'Bricolage Grotesque', sans-serif;
      }

      canvas { 
        display: block; 
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      .font-mono {
        font-family: 'Space Mono', monospace;
      }

      .btn-primary {
        @apply inline-flex items-center justify-center px-6 py-3 bg-[var(--primary)] text-white font-semibold rounded-[var(--border-radius-md)] shadow-[var(--shadow-medium)] hover:bg-[var(--primary-dark)] hover:shadow-[var(--shadow-large)] transition-all duration-300 transform hover:-translate-y-1;
      }

      .btn-secondary {
        @apply inline-flex items-center justify-center px-6 py-3 border-2 border-[var(--primary)] text-[var(--primary)] font-semibold rounded-[var(--border-radius-md)] hover:bg-[var(--primary)] hover:text-white transition-all duration-300 transform hover:-translate-y-1;
      }

      .section-padding {
        @apply py-20 px-4;
      }

      .card-base {
        @apply bg-white rounded-[var(--border-radius-lg)] shadow-[var(--shadow-medium)] overflow-hidden transition-all duration-300;
      }

      .card-hover {
        @apply hover:shadow-[var(--shadow-large)] hover:-translate-y-2;
      }

      .gradient-text {
        background: linear-gradient(135deg, var(--dark-blue), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero-subtitle {
        @apply inline-flex items-center gap-2 px-4 py-2 bg-[var(--light-gray)] text-[var(--primary)] rounded-full font-mono text-sm font-medium mb-6;
      }

      .floating-animation {
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      .micro-interaction {
        @apply transition-all duration-200 hover:scale-105;
      }

      /* Typewriter Animation for Hero Title */
      .typewriter-text {
        position: relative;
        background: linear-gradient(135deg, var(--dark-blue), var(--primary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .typewriter-cursor {
        color: var(--primary);
        animation: blink 1s infinite;
        font-weight: 900;
      }

      @keyframes blink {
        0%, 50% {
          opacity: 1;
        }
        51%, 100% {
          opacity: 0;
        }
      }
    </style>
  
  <!-- Page-specific styles -->
  <style>
    body {
      min-height: max(884px, 100dvh);
    }

    #about p {
      margin-bottom: 1.5rem;
      line-height: 1.7;
      color: var(--slate-gray);
    }

    .contact-card {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    /* Navigation link styles */
    nav a {
      position: relative;
      transition: all 0.3s ease;
      cursor: pointer;
      z-index: 10;
    }

    nav a:hover {
      color: var(--primary) !important;
    }

    nav a.active {
      color: var(--primary) !important;
    }

    /* Ensure all anchor links are clickable */
    a[href^="#"] {
      cursor: pointer;
      pointer-events: auto;
      z-index: 5;
    }

    /* Smooth scroll behavior */
    html {
      scroll-behavior: smooth;
    }
  </style>

  <script>
    // Scroll reveal
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          revealObserver.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    });
  </script>
